<!doctype html>
<html lang="en" style="background:#0a0d14">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0a0d14">
<meta name="color-scheme" content="dark">
<title>JARVIS · Oura</title>
<style>
html,body{margin:0;background:#0a0d14;color:#e7ecf5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:48px 20px}
.card{background:#121826;border:1px solid #1e2738;border-radius:20px;padding:24px}
h1{font-size:22px;margin:0 0 16px;color:#4fd1ff}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;word-break:break-all;background:#0a0d14;border:1px solid #1e2738;border-radius:12px;padding:16px;margin:12px 0;user-select:all}
button{background:#4fd1ff;color:#0a0d14;border:0;border-radius:12px;padding:12px 20px;font-size:16px;font-weight:600;width:100%}
p{line-height:1.5;color:#b8c2d6}
.err{color:#ff8a8a}
</style>
</head>
<body style="background:#0a0d14">
<main><div class="card" id="c"><h1>JARVIS</h1><p>Loading…</p></div></main>
<script>
(function(){
var q=new URLSearchParams(location.search),code=q.get('code'),err=q.get('error'),c=document.getElementById('c');
function el(t,cls,txt){var e=document.createElement(t);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
c.innerHTML='';
if(code){
 c.appendChild(el('h1','','Oura connected, one last step'));
 c.appendChild(el('div','code',code));
 var b=el('button','','Copy');
 b.onclick=function(){var done=function(){b.textContent='Copied ✓'};
  if(navigator.clipboard)navigator.clipboard.writeText(code).then(done,function(){});
  else{var r=document.createRange();r.selectNodeContents(document.querySelector('.code'));var s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy');done()}};
 c.appendChild(b);
 c.appendChild(el('p','','Copy this code and paste it into the secure box JARVIS sends you in chat. It only works once, for a few minutes.'));
}else if(err){
 c.appendChild(el('h1','','Oura connection failed'));
 c.appendChild(el('p','err','Error: '+err+(q.get('error_description')?' — '+q.get('error_description'):'')));
}else{
 c.appendChild(el('h1','','JARVIS'));
 c.appendChild(el('p','','Nothing to do here.'));
}
history.replaceState(null,'',location.pathname);
})();
</script>
</body>
</html>
